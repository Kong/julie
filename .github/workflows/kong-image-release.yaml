name: release a new topology builder docker image

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override the release version (e.g. v1.2.3). Leave blank to auto-bump the patch version.'
        required: false
        type: string

env:
  ECR_ACCOUNT_ID: "910202568813"
  ECR_PROD_REGISTRY: 910202568813.dkr.ecr.us-east-2.amazonaws.com/kafka-topology-builder
  ECR_PROD_ROLE: arn:aws:iam::910202568813:role/ecr-github-kong-julie

jobs:
  determine-version:
    name: Determine Next Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Get latest tag and bump version
        id: bump
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            if ! [[ "$VERSION_OVERRIDE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version_override '$VERSION_OVERRIDE' is not a valid vMAJOR.MINOR.PATCH version"
              exit 1
            fi
            if git rev-parse "$VERSION_OVERRIDE" >/dev/null 2>&1; then
              echo "::error::Tag $VERSION_OVERRIDE already exists"
              exit 1
            fi
            NEW_VERSION="$VERSION_OVERRIDE"
            echo "Using manually overridden version: $NEW_VERSION"
          else
            # Get the latest tag that matches v*.*.* pattern
            LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ]; then
              # No tags found, start with v0.1.0
              NEW_VERSION="v0.1.0"
              echo "No existing tags found. Starting with $NEW_VERSION"
            else
              echo "Latest tag: $LATEST_TAG"
              # Remove 'v' prefix and split version
              VERSION_NO_V="${LATEST_TAG#v}"
              MAJOR=$(echo $VERSION_NO_V | cut -d. -f1)
              MINOR=$(echo $VERSION_NO_V | cut -d. -f2)
              PATCH=$(echo $VERSION_NO_V | cut -d. -f3)

              # Increment patch version
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              echo "Bumping from $LATEST_TAG to $NEW_VERSION"
            fi
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version will be: $NEW_VERSION"

  release-image:
    name: Release Image
    runs-on: ubuntu-latest
    needs: determine-version
    if: ${{needs.determine-version.result == 'success'}}
    environment: prod
    permissions:
        contents: write
        id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set up the JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #5.2.0
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 #v6.1.0
        with:
          role-to-assume: ${{ env.ECR_PROD_ROLE }}
          aws-region: us-east-2
          mask-aws-account-id: 'false'

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 #v2.1.2
        with:
          registries: ${{ env.ECR_ACCOUNT_ID }}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f #v7.1.0
        with:
          context: .
          file: release/docker/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE_PREFIX=910202568813.dkr.ecr.us-east-2.amazonaws.com/dockerhub/library/
          tags: ${{ env.ECR_PROD_REGISTRY }}:${{ needs.determine-version.outputs.version }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ needs.determine-version.outputs.version }} -m "Release ${{ needs.determine-version.outputs.version }}"
          git push origin ${{ needs.determine-version.outputs.version }}
